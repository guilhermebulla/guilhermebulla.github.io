<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Pedidos ao vivo — BullaAcoustic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231a1a1a'/><stop offset='1' stop-color='%230f0f0f'/></linearGradient><linearGradient id='gold' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23d4a853'/><stop offset='1' stop-color='%23b88d3e'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23bg)'/><rect x='3' y='3' width='94' height='94' rx='18' fill='none' stroke='%23d4a853' stroke-opacity='.6' stroke-width='2.5'/><rect x='9' y='9' width='82' height='82' rx='13' fill='none' stroke='%23d4a853' stroke-opacity='.25' stroke-width='1.5'/><text x='50' y='77' font-family='Playfair Display, Georgia, serif' font-size='74' font-weight='700' fill='url(%23gold)' text-anchor='middle'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css?v=9">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <main>
  <header class="app-header">
    <p class="hero-tag">Voz &amp; Violão</p>
    <h1 class="logo">Bulla<span>Acoustic</span></h1>
    <p class="tagline">Pedidos ao vivo — escolha do repertório</p>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="nome" placeholder="Seu nome" maxlength="40" autocomplete="name" aria-label="Seu nome">
  <div id="chip-nome" class="chip-nome" hidden>
    <span>Pedindo como: <strong id="chip-nome-valor"></strong></span>
    <button type="button" id="chip-alterar" class="chip-alterar">Alterar</button>
  </div>
  <p id="contador-pedidos" class="contador-pedidos" aria-live="polite"></p>
  <input id="busca" placeholder="Buscar música ou artista…" autocomplete="off" aria-label="Buscar música ou artista">
  <div id="resultado"></div>
    <h2>Fila agora <span class="contagem" id="fila-count"></span></h2>
  <div id="fila-publica"></div>
  </main>
  <footer>BullaAcoustic · voz e violão</footer>
  <script src="fila.js?v=4"></script>

<script>
  // PREENCHA com os dados do seu projeto Firebase (instruções no arquivo 4)
  firebase.initializeApp({
    apiKey: "AIzaSyBpiEPoYY7lH1s-uz6O2bf61Aw-uKCjjGE",
    authDomain: "bulla-pedidos.firebaseapp.com",
    projectId: "bulla-pedidos",
    appId: "1:459269474903:web:edc67d6f4e115eb2f3112"
  });
  const db = firebase.firestore();

  // ===== Nome salvo no navegador + chip "Pedindo como" + contador "X de 3" =====
  const campoNome = document.getElementById('nome');
  const chipNome = document.getElementById('chip-nome');
  const chipValor = document.getElementById('chip-nome-valor');
  const busca = document.getElementById('busca');
  const MAX_PEDIDOS_POR_PESSOA = 3;
  let filaPublica = [];
  campoNome.value = localStorage.getItem('bullaNome') || '';
  campoNome.addEventListener('input', () => {
    localStorage.setItem('bullaNome', campoNome.value.trim());
    atualizarContador();
  });
  campoNome.addEventListener('blur', confirmarNome);
  campoNome.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); confirmarNome(); }
  });
  document.getElementById('chip-alterar').addEventListener('click', () => {
    atualizarNomeUI(true);
    campoNome.focus();
  });

  function atualizarNomeUI(editando) {
    const salvo = (localStorage.getItem('bullaNome') || '').trim();
    const pronto = !!salvo && !editando;
    campoNome.hidden = pronto;
    chipNome.hidden = !pronto;
    chipValor.textContent = salvo;
    busca.disabled = !pronto;
    busca.placeholder = pronto ? 'Buscar música ou artista…' : 'Informe seu nome para pedir';
  }

  function confirmarNome() {
    const valor = campoNome.value.trim();
    if (!valor) {
      localStorage.removeItem('bullaNome');
      atualizarNomeUI(true);
    } else {
      localStorage.setItem('bullaNome', valor);
      atualizarNomeUI(false);
    }
    atualizarContador();
  }

  atualizarNomeUI(false);

  function atualizarContador() {
    const el = document.getElementById('contador-pedidos');
    const chave = normalizar(campoNome.value);
    if (!chave) { el.textContent = ''; el.classList.remove('cheio'); return; }
    const meus = filaPublica.filter(p => (p.requesterKey || '') === chave).length;
    el.textContent = `Seus pedidos na fila: ${meus} de ${MAX_PEDIDOS_POR_PESSOA}`;
    el.classList.toggle('cheio', meus >= MAX_PEDIDOS_POR_PESSOA);
  }

  // ===== Toast (porta do karaoke) =====
  let toastTimer = null;
  function toast(msg, tipo) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast mostrar' + (tipo ? ' ' + tipo : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('mostrar'), tipo === 'erro' ? 6000 : 3000);
  }

  // Fila pública ao vivo: mesma ordenação da mesa (fila.js)
  let todosPedidos = [];
  let showAtual = 1;
  let apoiosPorPedido = {};

  let pararPedidos = null;
  let filaComErro = false;
  function assinarPedidos() {
    if (pararPedidos) pararPedidos();
    pararPedidos = db.collection('pedidos')
      .where('show', '==', showAtual)
      .onSnapshot(snap => {
        todosPedidos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        filaComErro = false;
        renderFilaPublica();
      }, () => {
        filaComErro = true;
        renderFilaPublica();
      });
  }
  let pararApoios = null;
  function assinarApoios() {
    if (pararApoios) pararApoios();
    pararApoios = db.collectionGroup('apoios')
      .where('show', '==', showAtual)
      .onSnapshot(snap => {
        apoiosPorPedido = {};
        snap.docs.forEach(d => {
          const pid = d.ref.parent.parent.id;
          (apoiosPorPedido[pid] = apoiosPorPedido[pid] || []).push(d.id);
        });
        renderFilaPublica();
      }, err => {
        console.error('Falha ao ler apoios (verifique o índice no F12):', err);
      });
  }
  db.doc('show/atual').onSnapshot(doc => {
    showAtual = doc.exists ? doc.data().numero : 1;
    assinarPedidos();
    assinarApoios();
    renderFilaPublica();
  }, () => {});


  function renderFilaPublica() {
    const contagem = {};
    Object.keys(apoiosPorPedido).forEach(pid => { contagem[pid] = apoiosPorPedido[pid].length; });
    const itens = BullaFila.ordenarFila(todosPedidos, showAtual, contagem);
    filaPublica = itens;
    atualizarContador();
    const alvo = document.getElementById('fila-publica');
    document.getElementById('fila-count').textContent =
      itens.length ? `(${itens.length})` : '';
    const meuNome = normalizar(document.getElementById('nome').value);
    if (filaComErro) {
      alvo.innerHTML = '<p class="sub">Fila indisponível agora. Atualize a página.</p>';
      return;
    }
    alvo.innerHTML = itens.length
      ? itens.map((p, i) => {
          const eu = !!meuNome && (p.requesterKey || '') === meuNome;
          const apoiadores = apoiosPorPedido[p.id] || [];
          const jaApoiei = !!meuNome && apoiadores.includes(meuNome);
          return `<div class="musica${eu ? ' eu' : ''}"><span class="num">${i + 1}</span>` +
          `<div><strong>${esc(p.title)}</strong>` +
          `<span>${esc(p.requester)} na fila</span>` +
          (eu ? '<div class="me-tag">É VOCÊ</div>' : '') +
          `<button type="button" class="apoio-btn" data-pid="${p.id}" aria-pressed="${jaApoiei}" title="Apoiar esta música">♥ ${apoiadores.length}${jaApoiei ? ' · apoiado' : ''}</button>` +
          `</div></div>`;
        }).join('')
      : '<p class="sub">Nenhum pedido na fila. Seja o primeiro!</p>';
  }

    let catalogo = [];
  let selecionada = null;
  fetch('repertorio.json')
    .then(r => r.json())
    .then(d => { catalogo = d; })
    .catch(() => {
      document.getElementById('resultado').innerHTML =
        '<p class="sub">Não foi possível carregar o repertório. Verifique a conexão.</p>';
    });

  document.getElementById('busca').addEventListener('input', e => {
    const q = normalizar(e.target.value);
    const alvo = document.getElementById('resultado');
    selecionada = null;
    if (q.length < 2) { alvo.innerHTML = ''; return; }
    if (!catalogo.length) {
      alvo.innerHTML = '<p class="sub">Repertório ainda carregando. Verifique a conexão.</p>';
      return;
    }
    // Busca por palavras: TODOS os termos precisam bater (ex.: "djavan sina")
    const termos = q.split(/\s+/).filter(Boolean);
    const todos = catalogo
      .map((m, idx) => ({ idx, ...m }))
      .filter(m => {
        const texto = normalizar((m.musica || '') + ' ' + (m.artista || ''));
        return termos.every(t => texto.includes(t));
      });
    const achados = todos.slice(0, 20);
    if (!achados.length) {
      alvo.innerHTML = '<p class="sub"><strong>Nada encontrado</strong><br>Tente outro trecho do nome ou do artista.</p>';
      return;
    }
    let html = achados.map(m =>
      `<button type="button" class="musica musica-btn" data-idx="${m.idx}"><strong>${esc(m.musica)}</strong>` +
      `<span>${esc(m.artista)} · ${esc((m.estilo || []).join(', '))}</span></button>`
    ).join('');
    if (todos.length > achados.length) {
      html += `<p class="sub">Mais ${todos.length - achados.length} resultado(s). Refine a busca.</p>`;
    }
    alvo.innerHTML = `<p class="sub" aria-live="polite">${todos.length} resultado(s)</p>` + html;
  });

  let pedindo = false;
  document.getElementById('resultado').addEventListener('click', e => {
    const card = e.target.closest('.musica');
    if (!card || pedindo) return;
    const idx = Number(card.dataset.idx);
    selecionada = { idx, ...catalogo[idx] };
    pedindo = true;
    pedir().finally(() => { pedindo = false; });
  });

  function normalizar(s) {
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/\//g, ' ').trim().replace(/\s+/g, ' ');
  }

  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

  const apoiando = new Set();
  document.getElementById('fila-publica').addEventListener('click', e => {
    const btn = e.target.closest('.apoio-btn');
    if (!btn) return;
    const pid = btn.dataset.pid;
    if (apoiando.has(pid)) return;
    const nome = document.getElementById('nome').value.trim();
    if (!nome) { toast('Digite seu nome primeiro.', 'aviso'); return; }
    apoiando.add(pid);
    apoiar(pid, nome)
      .then(ok => { if (ok) toast('Apoio registrado.'); })
      .finally(() => apoiando.delete(pid));
  });

  async function apoiar(pedidoId, nomeApoiador) {
    try {
      const chave = normalizar(nomeApoiador);
      const ref = db.collection('pedidos').doc(pedidoId).collection('apoios').doc(chave);
      const existe = await ref.get();
      if (existe.exists) {
        toast('Você já apoiou esta música', 'aviso');
        return false;
      }
      await ref.set({
        requester: nomeApoiador,
        requesterKey: chave,
        show: showAtual,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      return true;
    } catch (err) {
      toast('Falha ao apoiar. Tente de novo.', 'erro');
      return false;
    }
  }

  async function pedir() {
    const nome = document.getElementById('nome').value.trim();
    if (!nome) { toast('Digite seu nome primeiro.', 'aviso'); return; }
    if (!selecionada) return;
    toast('Enviando pedido…');
    try {
      const doShow = await db.collection('pedidos')
        .where('show', '==', showAtual).get();
      const chaveMusica = normalizar(selecionada.musica) + '|' + normalizar(selecionada.artista);
      const chaveNome = normalizar(nome);
      const mesmaMusica = d => {
        const p = d.data();
        return normalizar(p.title) + '|' + normalizar(p.artist) === chaveMusica;
      };
      const repetido = doShow.docs.some(d =>
        normalizar(d.data().requester) === chaveNome && mesmaMusica(d));
      if (repetido) {
        toast('Você já pediu esta música', 'aviso');
        return;
      }
      const pendente = doShow.docs.find(d => d.data().status === 'fila' && mesmaMusica(d));
      if (pendente) {
        const ok = await apoiar(pendente.id, nome);
        if (ok) {
          toast(`Juntos somos mais! Seu pedido se juntou ao de ${pendente.data().requester}!`);
          document.getElementById('busca').value = '';
          document.getElementById('resultado').innerHTML = '';
          selecionada = null;
        }
        return;
      }
      const meus = await db.collection('pedidos')
        .where('requesterKey', '==', normalizar(nome))
        .where('status', '==', 'fila')
        .where('show', '==', showAtual).get();
      if (meus.size >= MAX_PEDIDOS_POR_PESSOA) {
        toast(`Você já tem ${MAX_PEDIDOS_POR_PESSOA} pedidos na fila. Aguarde um deles tocar.`, 'aviso');
        return;
      }
      await db.collection('pedidos').add({
        songId: selecionada.idx,
        title: selecionada.musica,
        artist: selecionada.artista,
        requester: nome, requesterKey: normalizar(nome),
        status: 'fila', show: showAtual,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast(`Pedido enviado: "${selecionada.musica}". Acompanhe a posição na fila.`);
      document.getElementById('busca').value = '';
      document.getElementById('resultado').innerHTML = '';
      selecionada = null;
    } catch (err) {
      toast('Falha ao enviar. Tente de novo.', 'erro');
    }
  }
</script>
</body>
</html>
