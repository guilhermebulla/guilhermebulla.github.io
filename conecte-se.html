    <style>
        :root {
            --bg: #0f0f0f;
            --bg-elevated: #171717;
            --text: #f5f5f5;
            --text-muted: #a3a3a3;
            --gold: #d4a853;
            --gold-hover: #b88d3e;
            --gold-soft: rgba(212, 168, 83, 0.12);
            --border: #2a2a2a;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }
        /* Gradiente de fundo com profundidade */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(212, 168, 83, 0.15), transparent 60%);
            pointer-events: none;
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        header {
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(to right, transparent 0%, var(--gold) 50%, transparent 100%);
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 2.75rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: var(--gold);
        }
        .logo span {
            color: var(--text);
            font-weight: 400;
        }
        .tagline {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 48px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1.5px solid var(--gold);
            background: transparent;
            color: var(--gold);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        .btn-primary {
            background: var(--gold);
            color: #0f0f0f;
            border-color: var(--gold);
        }
        .btn-primary::before {
            background: rgba(15, 15, 15, 0.3);
        }
        .btn-primary:hover {
            background: var(--gold-hover);
            border-color: var(--gold-hover);
        }
        .btn-primary:hover::after {
            background: radial-gradient(circle at 30% 30%, rgba(15, 15, 15, 0.15), transparent 70%);
        }
        /* Efeito de ripple ao clicar */
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(212, 168, 83, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .btn:active::before {
            animation: ripple 0.6s ease-out;
        }
        @keyframes ripple {
            to {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }
        /* Hover: elevação + glow */
        .btn:hover {
            background: var(--gold-soft);
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(212, 168, 83, 0.2);
            border-color: var(--gold-hover);
        }
        .btn:hover::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: radial-gradient(circle at 30% 30%, rgba(212, 168, 83, 0.1), transparent 70%);
            pointer-events: none;
        }
        .btn:active {
            transform: translateY(-2px);
        }
        footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        /* Responsividade */
        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
            .logo {
                font-size: clamp(1.6rem, 6vw, 2rem);
            }
            .tagline {
                font-size: 0.85rem;
            }
            .btn {
                padding: 14px 20px;
                font-size: 0.95rem;
            }
            header {
                margin-bottom: 40px;
                padding-bottom: 24px;
            }
        }
        @media (max-width: 320px) {
            body {
                padding: 16px;
            }
            .logo {
                font-size: 1.5rem;
            }
            .tagline {
                font-size: 0.8rem;
            }
            .btn {
                padding: 12px 16px;
                font-size: 0.9rem;
            }
            header {
                margin-bottom: 32px;
            }
        }
    </style>
</head>
