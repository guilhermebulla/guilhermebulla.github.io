<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f0f">
<title>Mesa do músico — BullaAcoustic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%231a1a1a'/><stop offset='1' stop-color='%230f0f0f'/></linearGradient><linearGradient id='gold' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23d4a853'/><stop offset='1' stop-color='%23b88d3e'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23bg)'/><rect x='3' y='3' width='94' height='94' rx='18' fill='none' stroke='%23d4a853' stroke-opacity='.6' stroke-width='2.5'/><rect x='9' y='9' width='82' height='82' rx='13' fill='none' stroke='%23d4a853' stroke-opacity='.25' stroke-width='1.5'/><text x='50' y='77' font-family='Playfair Display, Georgia, serif' font-size='74' font-weight='700' fill='url(%23gold)' text-anchor='middle'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css?v=4">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <main>
  <div id="tela-pin">
    <header class="app-header">
      <p class="hero-tag">Voz &amp; Violão</p>
      <h1 class="logo">Bulla<span>Acoustic</span></h1>
      <p class="tagline">Mesa do músico — acesso restrito</p>
    </header>
    <p class="erro-pin" id="erro-pin"></p>
    <input id="pin" type="password" placeholder="PIN alfanumérico" maxlength="24" autocomplete="off">
    <button id="btn-pin">Entrar</button>
  </div>

  <div id="painel" hidden>
    <header class="app-header">
      <p class="hero-tag">Voz &amp; Violão</p>
      <h1 class="logo">Bulla<span>Acoustic</span></h1>
      <p class="tagline">Mesa do músico — fila ao vivo</p>
    </header>
    <h2 id="fila-titulo">Fila</h2>
    <div id="fila" class="fila"></div>

    <h2>Já rolaram</h2>
    <div id="historico"></div>
  </div>
  </main>

  <footer>BullaAcoustic · voz e violão</footer>

<script>
  // Mesmas credenciais do pedidos.html (projeto bulla-pedidos)
  firebase.initializeApp({
    apiKey: "AIzaSyBpiEpoyY7lH1s-uz602bf61aw-uKCjjGE",
    authDomain: "bulla-pedidos.firebaseapp.com",
    projectId: "bulla-pedidos",
    appId: "1:459269474903:web:edc67d6f4e115eb2f3112"
  });
  const db = firebase.firestore();

  // ---- PIN central: validado contra config/pin no Firestore ----
  document.getElementById('btn-pin').addEventListener('click', async () => {
    const v = document.getElementById('pin').value.trim();
    const erro = document.getElementById('erro-pin');
    if (v.length < 4) { erro.textContent = 'Mínimo de 4 caracteres.'; return; }
    erro.textContent = 'Verificando…';
    try {
      const doc = await db.collection('config').doc('pin').get();
      if (!doc.exists || doc.data().pin !== v) {
        erro.textContent = 'PIN incorreto.';
        return;
      }
      sessionStorage.setItem('mesa_autenticada', '1');
      abrirPainel();
    } catch (e) {
      erro.textContent = 'Erro ao verificar o PIN. Verifique a conexão.';
    }
  });
  document.getElementById('pin').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btn-pin').click();
  });

  if (sessionStorage.getItem('mesa_autenticada')) abrirPainel();

  function abrirPainel() {
    document.getElementById('tela-pin').hidden = true;
    document.getElementById('painel').hidden = false;
    iniciarFila();
  }

  // ---- Fila + histórico em tempo real ----
  function iniciarFila() {
    db.collection('pedidos').onSnapshot(snap => {
      const todos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Rodízio por quem pediu (só vale para quem não tem ordem manual)
      const feitos = {};
      for (const p of todos) {
        if (p.status === 'tocada' || p.status === 'pulada') {
          const k = (p.requesterKey || '').toLowerCase();
          feitos[k] = (feitos[k] || 0) + 1;
        }
      }
      const fila = todos.filter(p => p.status === 'fila');
      fila.sort((a, b) => {
        // Ordem manual vence quando existir
        const oa = (a.ordem != null) ? a.ordem : Infinity;
        const ob = (b.ordem != null) ? b.ordem : Infinity;
        if (oa !== ob) return oa - ob;
        const ka = (a.requesterKey || '').toLowerCase();
        const kb = (b.requesterKey || '').toLowerCase();
        if ((feitos[ka] || 0) !== (feitos[kb] || 0)) {
          return (feitos[ka] || 0) - (feitos[kb] || 0);
        }
        return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
      });
      render(fila);

      const hist = todos.filter(p => p.status === 'tocada' || p.status === 'pulada');
      hist.sort((a, b) =>
        (b.finishedAt?.seconds || b.createdAt?.seconds || 0) -
        (a.finishedAt?.seconds || a.createdAt?.seconds || 0));
      renderHist(hist);
    }, err => {
      document.getElementById('fila').innerHTML =
        '<p class="vazio">Erro ao carregar a fila. Recarregue a página.</p>';
    });
  }

  let filaAtual = [];

    function render(itens) {
    filaAtual = itens;
    const alvo = document.getElementById('fila');
    document.getElementById('fila-titulo').innerHTML =
      itens.length ? `Fila <span class="contagem">· ${itens.length} na fila</span>` : 'Fila';
    if (!itens.length) {
      alvo.innerHTML = '<p class="vazio">Nenhum pedido na fila ainda.</p>';
      return;
    }
    alvo.innerHTML = itens.map((p, i) => `
      <div class="pedido${i === 0 ? ' agora' : ''}" data-id="${p.id}">
        <div class="q-col">
          <button class="ord" data-op="subir" aria-label="Subir na fila" ${i === 0 ? 'disabled' : ''}>▲</button>
          <span class="num">${i + 1}</span>
          <button class="ord" data-op="descer" aria-label="Descer na fila" ${i === itens.length - 1 ? 'disabled' : ''}>▼</button>
        </div>
        <div class="q-info">
          <strong>${esc(p.title)}</strong>
          <span>${esc(p.artist)} · ${esc(p.requester)}</span>
          <div class="acoes">
            <button data-op="tocada">Tocada</button>
            <button data-op="pulada" class="btn-sec">Pular</button>
          </div>
        </div>
        <button class="lixeira" data-op="remover" aria-label="Remover da fila" title="Remover da fila"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg></button>
      </div>
    `).join('');
  }

  function renderHist(itens) {
    const alvo = document.getElementById('historico');
    if (!itens.length) {
      alvo.innerHTML = '<p class="vazio">Nada tocado ainda neste show.</p>';
      return;
    }
    alvo.innerHTML = itens.map(p => {
      const seg = p.finishedAt?.seconds;
      const hora = seg
        ? new Date(seg * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
        : '';
      return `
      <div class="hist ${p.status === 'pulada' ? 'pulada' : ''}">
        ${hora ? `<span class="hora">${hora}${p.status === 'pulada' ? ' · pulada' : ''}</span>` : ''}
        <strong>${esc(p.title)}</strong>
        <span>${esc(p.artist)} · ${esc(p.requester)}</span>
        ${p.status === 'pulada' ? `
        <div class="acoes">
          <button data-op="devolver" data-id="${p.id}" class="btn-sec">Devolver à fila</button>
        </div>` : ''}
      </div>`;
    }).join('');
  }

    document.getElementById('fila').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-op]');
    if (!btn || btn.disabled) return;
    const id = btn.closest('.pedido').dataset.id;
    const op = btn.dataset.op;
    if (op === 'subir' || op === 'descer') {
      const i = filaAtual.findIndex(p => p.id === id);
      const j = op === 'subir' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= filaAtual.length) return;
      const nova = [...filaAtual];
      [nova[i], nova[j]] = [nova[j], nova[i]];
      const batch = db.batch();
      nova.forEach((p, k) => batch.update(db.collection('pedidos').doc(p.id), { ordem: k }));
      try { await batch.commit(); }
      catch (err) {
        console.error('Falha ao gravar ordem:', err);
        alert('Não consegui salvar a nova ordem. Veja o console (F12).');
      }
    } else if (op === 'remover') {
      if (!confirm('Remover este pedido da fila? Essa ação não pode ser desfeita.')) return;
      db.collection('pedidos').doc(id).delete();
    } else {
      db.collection('pedidos').doc(id).update({
        status: op === 'tocada' ? 'tocada' : 'pulada',
        finishedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  });

  document.getElementById('historico').addEventListener('click', e => {
    const btn = e.target.closest('button[data-op="devolver"]');
    if (!btn) return;
    db.collection('pedidos').doc(btn.dataset.id).update({
      status: 'fila',
      finishedAt: firebase.firestore.FieldValue.delete()
    });
  });

  function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
